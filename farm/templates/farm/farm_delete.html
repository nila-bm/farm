{% extends "base.html" %}

{% block page_title %}Delete Farm{% endblock %}

{% block page_content %}

<h2>Delete Farm</h2>

<p>Are you sure you want to delete the <strong>{{ farm.name }}</strong> ?</p>

<form method="post">
    {% csrf_token %}

    <button type="submit" class="btn btn-danger"> Delete </button>

    <a href="{% url 'farm:farmdetail' farm.pk %}" class="btn btn-secondary"> Cancel </a>

</form>

{% endblock %}
